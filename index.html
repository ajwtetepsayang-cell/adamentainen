<script>
(() => {
'use strict';
const INITIAL = JSON.parse(document.getElementById('seedData').textContent);
const STORE_KEY='ada_padel_maintenance_v1';
const CONFIG_KEY='ada_padel_supabase_config_v1';
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const clone=o=>JSON.parse(JSON.stringify(o));
let state=loadLocal();
let currentView='dashboard';
let showTaskForm=false, editingTaskId=null, showPriorityForm=false, checklistTab='input';
let supabaseClient=null, session=null, remoteChannel=null, isRemoteLoading=false, lastCloudMessage='';
let query='';

function saveLocal(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){toast('Penyimpanan browser penuh. Ekspor cadangan data secara berkala.')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function currency(v){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v||0))}
function number(v){return new Intl.NumberFormat('id-ID').format(Number(v||0))}
function prettyDate(d){if(!d)return '—'; const p=String(d).slice(0,10).split('-'); if(p.length!==3)return esc(d); return `${p[2]} ${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][Number(p[1])-1]||p[1]} ${p[0]}`}
function monthLabel(m){const [y,mo]=String(m||'').split('-');return `${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][Number(mo)-1]||mo} ${y||''}`}
function total(arr,field){return arr.reduce((s,x)=>s+Number(x[field]||0),0)}
function currentCloud(){return Boolean(supabaseClient&&session?.user)}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3200)}
function setStatus(text,detail,mode='local'){

  document.getElementById('connectionPill').style.background=mode==='cloud'?'#e9f8ee':mode==='error'?'#fff0f0':'#f9fde9';

uan','Disetujui','Dalam Proses','Selesai','Ditolak'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><div class="row-sub">${esc(p.action||'Belum ada tindakan')}</div>${btn('Hapus','delete-priority',{small:true,danger:true,id:p.id})}</td></tr>`).join('')||`<tr><td colspan="4">${empty('Belum ada pengajuan','Tambahkan kebutuhan pengadaan atau perbaikan.','◆')}</td></tr>`}</tbody></table></div></div><div class="footer-note">Total estimasi pada file awal: ${currency(INITIAL.meta.reportedActualCost?INITIAL.priorities.reduce((s,p)=>s+p.estimate,0):0)}.</div>`}
function renderCosts(){const months=['2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'];const agg={};months.forEach(m=>agg[m]=0);state.tasks.forEach(t=>{let k=t.reportMonth||(t.date||'').slice(0,7);agg[k]=(agg[k]||0)+Number(t.actualCost||0)});const max=Math.max(1,...Object.values(agg));const pendingEst=total(state.priorities.filter(p=>!['Ditolak'].includes(p.status)),'estimate');return `<div class="section-heading"><div><h2>Laporan biaya maintenance</h2><p>Ringkasan pengeluaran aktual dan kebutuhan pengajuan.</p></div><div class="toolbar">${btn('⇩ Ekspor CSV','export-csv')}${btn('Cetak laporan','print',{small:true})}</div></div><div class="cost-total"><div class="kpi"><div class="kpi-head"><span class="kpi-label">TOTAL BIAYA AKTUAL</span><span class="kpi-icon">Rp</span></div><div class="kpi-value" style="font-size:clamp(18px,2.3vw,28px)">${currency(total(state.tasks,'actualCost'))}</div><div class="kpi-foot">Dari ${state.tasks.length} pekerjaan aktual</div></div><div class="kpi amber"><div class="kpi-head"><span class="kpi-label">ESTIMASI PENGAJUAN</span><span class="kpi-icon">◆</span></div><div class="kpi-value" style="font-size:clamp(18px,2.3vw,28px)">${currency(pendingEst)}</div><div class="kpi-foot">Belum ditolak</div></div></div><div class="grid-main"><section class="card"><div class="card-head"><div><h3 class="card-title">Realisasi per bulan</h3><div class="card-sub">Sesuai periode kelompok di laporan sumber</div></div></div><div class="card-body"><div class="chart-list">${Object.entries(agg).sort(([a],[b])=>a.localeCompare(b)).map(([m,c])=>`<div class="chart-row"><div class="chart-month">${monthLabel(m)}</div><div class="bar-track"><div class="bar-fill" style="width:${c?Math.max(1,c/max*100):0}%"></div></div><div class="chart-value">${currency(c)}</div></div>`).join('')}</div></div></section><section class="card"><div class="card-head"><div><h3 class="card-title">Ringkasan kontrol biaya</h3><div class="card-sub">Jumlah pekerjaan, biaya, dan pengajuan</div></div></div><div class="card-body"><div class="priority-list"><div class="priority-item"><div class="priority-num">01</div><div><h4>Pekerjaan aktual</h4><p>Nilai dari semua perbaikan tercatat</p></div><div class="priority-cost">${currency(total(state.tasks,'actualCost'))}</div></div><div class="priority-item"><div class="priority-num">02</div><div><h4>Pengajuan prioritas</h4><p>Estimasi dari daftar kebutuhan</p></div><div class="priority-cost">${currency(total(state.priorities,'estimate'))}</div></div><div class="priority-item"><div class="priority-num">03</div><div><h4>Total jika seluruh estimasi disetujui</h4><p>Aktual + estimasi pengajuan aktif</p></div><div class="priority-cost">${currency(total(state.tasks,'actualCost')+pendingEst)}</div></div></div></div></section></div><section class="card"><div class="card-head"><div><h3 class="card-title">Rincian bulanan</h3><div class="card-sub">Data biaya dihitung otomatis dari catatan pekerjaan.</div></div></div><div class="card-body"><div class="month-table">${Object.entries(agg).sort(([a],[b])=>a.localeCompare(b)).map(([m,c])=>`<div class="month-row"><div><div class="month-name">${monthLabel(m)}</div><div class="month-info">${state.tasks.filter(t=>(t.reportMonth||(t.date||'').slice(0,7))===m).length} pekerjaan</div></div><div class="bar-track"><div class="bar-fill" style="width:${c?Math.max(1,c/max*100):0}%"></div></div><div class="month-val">${currency(c)}</div></div>`).join('')}</div></div></section><div class="notice info" style="margin-top:16px">Catatan: periode biaya mengikuti pengelompokan bulan dalam workbook sumber, sedangkan tanggal temuan/selesai ditampilkan sebagaimana disimpan di Excel.</div>`}
function renderSettings(){const config=loadConfig();const connected=currentCloud();return `<div class="section-heading"><div><h2>Pengaturan & sinkronisasi</h2><p>Aplikasi dapat digunakan lokal atau dihubungkan ke database cloud untuk sinkron antar perangkat.</p></div></div><div class="notice warn"><strong>Penting:</strong> Mode Lokal menyimpan data hanya di browser/perangkat ini. Untuk tim memakai data yang sama secara online, publikasikan aplikasi ke hosting dan hubungkan Supabase mengikuti petunjuk di paket aplikasi.</div><div class="settings-grid"><section class="card settings-card"><h3>Database online (Supabase)</h3><p>Masukkan Project URL dan anon/public key dari proyek Supabase Anda. Jangan pernah menaruh service-role key di aplikasi browser.</p><div id="cloudMsg" class="connection-status ${connected?'good':''}">${connected?'Terhubung ke database. Data akan disinkronkan antar pengguna yang login.':'Belum terhubung. Aplikasi saat ini menggunakan penyimpanan lokal.'}</div><form id="configForm"><div class="form-grid"><div class="field"><label>Supabase Project URL</label><input name="url" type="url" placeholder="https://xxxx.supabase.co" value="${esc(config.url||'')}" required></div><div class="field"><label>Anon / publishable key</label><input name="key" type="password" placeholder="sb_publishable_... atau anon key" value="${esc(config.key||'')}" required autocomplete="off"></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan konfigurasi</button>${connected?btn('Putuskan koneksi','disconnect-cloud',{danger:true}):''}</div></form><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Login tim</h3><p>Setiap petugas perlu akun email untuk membuka data cloud. Gunakan email dan password yang terdaftar dalam proyek Supabase yang sama.</p><form id="authForm"><div class="form-grid"><div class="field"><label>Email</label><input name="email" type="email" required placeholder="nama@perusahaan.com" autocomplete="username"></div><div class="field"><label>Password</label><input name="password" type="password" required minlength="6" placeholder="Minimal 6 karakter" autocomplete="current-password"></div></div><div class="form-actions"><button class="btn" type="button" data-action="sign-up">Buat akun</button><button class="btn btn-primary" type="submit">Login / sinkronkan</button>${connected?btn('Logout','logout-cloud'):''}</div></form><div id="authFoot" class="small-label" style="margin-top:12px">Jika konfirmasi email diaktifkan di Supabase, buka email untuk verifikasi sebelum login.</div></section>
<section class="card settings-card"><h3>Cadangan & data</h3><p>Ekspor backup agar data lokal tetap aman. File backup dapat dipindahkan ke perangkat lain melalui tombol impor.</p><div style="display:grid;gap:10px">${btn('⇩ Unduh backup JSON','export-json',{primary:true})}${btn('⇩ Unduh daftar pekerjaan CSV','export-csv') }<label class="btn" style="justify-content:center;cursor:pointer">⇧ Impor backup JSON<input type="file" id="importFile" accept="application/json,.json" hidden></label>${btn('⎙ Cetak / simpan PDF','print')}</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Status perangkat</h3><p>Ringkasan penyimpanan aplikasi saat ini.</p><div class="connection-status"><strong>${state.tasks.length}</strong> pekerjaan · <strong>${state.priorities.length}</strong> pengajuan · <strong>${state.checks.length}</strong> checklist baru · <strong>${state.history.length}</strong> catatan historis.<br><br>Data awal: <strong>${esc(INITIAL.workbook)}</strong></div><div class="notice info">Untuk penggunaan online bersama: deploy file aplikasi, buat tabel database dengan SQL yang disediakan, lalu masukkan URL dan key di atas. Database yang sama dipakai oleh seluruh akun tim.</div></section></div><div class="footer-note">Aplikasi versi awal 1.0 · Penyimpanan lokal tersedia tanpa login.</div>`}
function render(){document.getElementById('navTaskCount').textContent=state.tasks.length;document.getElementById('navPriorityCount').textContent=state.priorities.length;let c=document.getElementById('content');if(currentView==='dashboard')c.innerHTML=renderDashboard();else if(currentView==='tasks')c.innerHTML=renderTasks();else if(currentView==='checklist')c.innerHTML=renderChecklist();else if(currentView==='priorities')c.innerHTML=renderPriorities();else if(currentView==='costs')c.innerHTML=renderCosts();else c.innerHTML=renderSettings();}
function persist(){saveLocal();render()}
function makeId(prefix){return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`}
function loadConfig(){try{return JSON.parse(localStorage.getItem(CONFIG_KEY)||'{}')}catch(e){return {}}}
function saveConfig(c){localStorage.setItem(CONFIG_KEY,JSON.stringify(c))}
function recordFor(kind,item){return {id:item.id,kind,data:item,updated_at:new Date().toISOString(),updated_by:session?.user?.id||null}}
function collectionFor(kind){return kind==='task'?state.tasks:kind==='priority'?state.priorities:kind==='checklist'?state.checks:kind==='history'?state.history:null}
async function cloudUpsert(kind,item){if(!currentCloud()||isRemoteLoading)return;const {error}=await supabaseClient.from('maintenance_data').upsert(recordFor(kind,item),{onConflict:'id'});if(error){setStatus('Database belum tersinkron. Data tetap tersimpan lokal.',error.message,'error');toast('Data lokal tersimpan, sinkron cloud gagal: '+error.message);return false}return true}
async function cloudDelete(id){if(!currentCloud()||isRemoteLoading)return;const {error}=await supabaseClient.from('maintenance_data').delete().eq('id',id);if(error)toast('Penghapusan cloud gagal: '+error.message)}
async function saveItem(kind,item){const col=collectionFor(kind);const i=col.findIndex(x=>x.id===item.id);if(i>=0)col[i]=item;else col.unshift(item);saveLocal();render();if(currentCloud())await cloudUpsert(kind,item)}
async function deleteItem(kind,id){const col=collectionFor(kind);if(!col)return;const i=col.findIndex(x=>x.id===id);if(i>=0)col.splice(i,1);saveLocal();render();await cloudDelete(id);toast('Data berhasil dihapus.')}
async function initCloud(){if(!supabaseClient)return;try{const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;session=data.session;if(!session){setStatus('Belum login. Data disimpan secara lokal.','Masuk melalui Pengaturan & Sinkronisasi untuk mengaktifkan data bersama.','local');return}await loadRemote();setupRealtime();setStatus('Database online aktif','Login sebagai '+session.user.email+'. Perubahan disinkronkan antar pengguna yang terhubung.','cloud');if(currentView==='settings')render()}catch(e){setStatus('Database belum tersedia','Periksa URL, key, SQL tabel, dan izin akses. '+(e.message||''),'error')}}
async function loadRemote(){if(!currentCloud())return;isRemoteLoading=true;try{const {data,error}=await supabaseClient.from('maintenance_data').select('id,kind,data,updated_at,updated_by');if(error)throw error;if(!data.length){const rows=[];state.tasks.forEach(x=>rows.push(recordFor('task',x)));state.priorities.forEach(x=>rows.push(recordFor('priority',x)));state.checks.forEach(x=>rows.push(recordFor('checklist',x)));state.history.forEach(x=>rows.push(recordFor('history',x)));for(let i=0;i<rows.length;i+=100){const {error:upErr}=await supabaseClient.from('maintenance_data').upsert(rows.slice(i,i+100),{onConflict:'id'});if(upErr)throw upErr}lastCloudMessage='Data awal dari Excel berhasil disalin ke database.';}else{const by={task:[],priority:[],checklist:[],history:[]};for(const row of data){if(by[row.kind]&&row.data)by[row.kind].push(row.data)}state.tasks=by.task;state.priorities=by.priority;state.checks=by.checklist;state.history=by.history;saveLocal();lastCloudMessage='Data terbaru dimuat dari database.'}saveLocal();render()}catch(e){setStatus('Gagal memuat database','Periksa apakah tabel maintenance_data sudah dibuat dan RLS mengizinkan akun login. '+e.message,'error');toast('Sinkronisasi gagal: '+e.message)}finally{isRemoteLoading=false}}
function setupRealtime(){if(!currentCloud()||remoteChannel)return;remoteChannel=supabaseClient.channel('ada-padel-maintenance-live').on('postgres_changes',{event:'*',schema:'public',table:'maintenance_data'},()=>{if(!isRemoteLoading){clearTimeout(setupRealtime.timer);setupRealtime.timer=setTimeout(()=>loadRemote(),450)}}).subscribe((status)=>{if(status==='SUBSCRIBED')setStatus('Database online aktif','Perubahan akan disinkronkan antar perangkat.','cloud')})}
async function configureClient(url,key){if(!window.supabase?.createClient){throw new Error('Library koneksi online belum terunduh. Periksa internet saat pertama membuka aplikasi.')}const oldSession= session; if(remoteChannel&&supabaseClient){try{await supabaseClient.removeChannel(remoteChannel)}catch(e){} remoteChannel=null}supabaseClient=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});await initCloud();return true}
function download(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('ADA_PADEL_Maintenance_Backup_'+localDate()+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),workbook:INITIAL.workbook,tasks:state.tasks,priorities:state.priorities,checks:state.checks,history:state.history,assets:state.assets},null,2),'application/json');toast('Backup JSON siap diunduh.')}
function csvEscape(v){const s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){const header=['ID','Tanggal','Periode','Area','Temuan','Tindakan','Status','Tanggal Selesai','Biaya Aktual'];const lines=[header,...state.tasks.map(t=>[t.id,t.date,t.reportMonth,t.area,t.finding,t.action,t.status,t.completionDate||t.completionLabel,t.actualCost])].map(r=>r.map(csvEscape).join(','));download('ADA_PADEL_Pekerjaan_Maintenance_'+localDate()+'.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');toast('Daftar pekerjaan CSV siap diunduh.')}
function importJSONFile(file){const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj||!Array.isArray(obj.tasks)||!Array.isArray(obj.priorities))throw new Error('Format backup tidak sesuai.');if(!confirm('Impor backup akan mengganti data pekerjaan, pengajuan, dan checklist di browser ini. Lanjutkan?'))return;state.tasks=obj.tasks;state.priorities=obj.priorities;state.checks=Array.isArray(obj.checks)?obj.checks:[];state.history=Array.isArray(obj.history)?obj.history:clone(INITIAL.history);saveLocal();render();toast('Backup berhasil diimpor ke perangkat ini.');if(currentCloud())toast('Backup lokal diimpor. Gunakan akun online yang sesuai untuk menyimpan ke cloud.')}catch(e){toast('Gagal impor: '+e.message)}};reader.readAsText(file)}
function formValue(form,name){return form.elements[name]?.value?.trim?.()??form.elements[name]?.value??''}
function handleClick(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 if(a==='add-task'){showTaskForm=true;editingTaskId=null;setView('tasks');return}if(a==='go-tasks'){setView('tasks');return}if(a==='go-costs'){setView('costs');return}if(a==='go-priorities'){setView('priorities');return}if(a==='go-checklist'){checklistTab='input';setView('checklist');return}
 if(a==='edit-task'){editingTaskId=id;showTaskForm=true;render();document.getElementById('taskForm')?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(a==='cancel-task'){showTaskForm=false;editingTaskId=null;render();return}if(a==='complete-task'){const t=state.tasks.find(x=>x.id===id);if(t){t.status='Selesai';t.completionDate=localDate();saveItem('task',t);toast('Pekerjaan ditandai selesai.')}return}
 if(a==='add-priority'){showPriorityForm=true;render();return}if(a==='cancel-priority'){showPriorityForm=false;render();return}
 if(a==='delete-task'){if(confirm('Hapus pekerjaan ini?'))deleteItem('task',id);return}if(a==='delete-priority'){if(confirm('Hapus pengajuan ini?'))deleteItem('priority',id);return}if(a==='delete-check'){if(confirm('Hapus catatan checklist ini?'))deleteItem('checklist',id);return}
 if(a==='checklist-input'){checklistTab='input';render();return}if(a==='checklist-history'){checklistTab='history';render();return}
 if(a==='export-json'){exportJSON();return}if(a==='export-csv'){exportCSV();return}if(a==='print'){window.print();return}if(a==='disconnect-cloud'){localStorage.removeItem(CONFIG_KEY);if(supabaseClient&&remoteChannel){supabaseClient.removeChannel(remoteChannel);remoteChannel=null}supabaseClient=null;session=null;setStatus('Mode lokal aktif','Data tersimpan di browser ini. Hubungkan database untuk sinkron antar perangkat.','local');render();toast('Koneksi cloud dilepas.');return}
 if(a==='logout-cloud'){if(supabaseClient)supabaseClient.auth.signOut().then(()=>{session=null;setStatus('Mode lokal aktif','Anda logout. Data tetap tersimpan lokal.','local');render();toast('Anda telah logout.')});return}
 if(a==='sign-up'){const f=document.getElementById('authForm');if(!supabaseClient){toast('Simpan konfigurasi database terlebih dahulu.');return}const email=formValue(f,'email'),password=formValue(f,'password');if(!email||password.length<6){toast('Isi email dan password minimal 6 karakter.');return}supabaseClient.auth.signUp({email,password}).then(({data,error})=>{if(error)toast('Pembuatan akun gagal: '+error.message);else if(data.session){session=data.session;initCloud().then(()=>toast('Akun dibuat dan login berhasil.'))}else toast('Pendaftaran berhasil. Periksa email untuk konfirmasi, lalu login.');});return}
}
async function handleSubmit(e){const form=e.target;if(form.id==='taskForm'){e.preventDefault();const f=new FormData(form);const id=f.get('id')||makeId('task');const prior=state.tasks.find(t=>t.id===id);const date=f.get('date')||localDate();const item={...(prior||{}),id,date,reportMonth:f.get('reportMonth')||date.slice(0,7),area:String(f.get('area')||'').trim(),finding:String(f.get('finding')||'').trim(),action:String(f.get('action')||'').trim(),status:f.get('status')||'Dalam Proses',completionDate:f.get('completionDate')||'',completionLabel:'',actualCost:Number(f.get('actualCost')||0),priority:prior?.priority||'Normal'};if(item.status==='Selesai'&&!item.completionDate)item.completionDate=localDate();await saveItem('task',item);showTaskForm=false;editingTaskId=null;toast(prior?'Perubahan pekerjaan tersimpan.':'Pekerjaan baru berhasil dicatat.');return}
 if(form.id==='priorityForm'){e.preventDefault();const f=new FormData(form);const item={id:makeId('priority'),area:String(f.get('area')||'').trim(),finding:String(f.get('finding')||'').trim(),estimate:Number(f.get('estimate')||0),status:'Menunggu Persetujuan',createdDate:localDate(),action:String(f.get('action')||'').trim()};await saveItem('priority',item);showPriorityForm=false;toast('Pengajuan prioritas berhasil ditambahkan.');return}
 if(form.id==='checkForm'){e.preventDefault();const f=new FormData(form);const a=state.assets.find(x=>x.id===f.get('assetId'));if(!a){toast('Pilih aset yang akan diperiksa.');return}const item={id:makeId('check'),date:f.get('date')||localDate(),frequency:f.get('frequency'),area:a.area,asset:a.asset,status:f.get('status'),notes:String(f.get('notes')||'').trim(),action:String(f.get('action')||'').trim(),createdBy:session?.user?.email||'lokal'};await saveItem('checklist',item);checklistTab='input';toast('Checklist tersimpan.');return}
 if(form.id==='configForm'){e.preventDefault();const f=new FormData(form),url=String(f.get('url')||'').trim().replace(/\/$/,''),key=String(f.get('key')||'').trim();if(!url.startsWith('https://')){toast('Project URL harus diawali https://');return}saveConfig({url,key});try{await configureClient(url,key);toast('Konfigurasi disimpan.');render()}catch(err){setStatus('Gagal menghubungkan database',err.message,'error');toast('Gagal koneksi: '+err.message)}return}
 if(form.id==='authForm'){e.preventDefault();if(!supabaseClient){toast('Isi dan simpan konfigurasi Supabase terlebih dahulu.');return}const f=new FormData(form);const {data,error}=await supabaseClient.auth.signInWithPassword({email:String(f.get('email')||'').trim(),password:String(f.get('password')||'')});if(error){toast('Login gagal: '+error.message);return}session=data.session;await initCloud();toast('Login berhasil. Sinkronisasi online aktif.');return}}

document.addEventListener('click',handleClick);
document.addEventListener('submit',e=>{handleSubmit(e)});
document.addEventListener('change',e=>{if(e.target.id==='taskStatusFilter'||e.target.id==='taskSearch'||e.target.id==='historyFilter'){render();return}if(e.target.classList.contains('priority-status')){const p=state.priorities.find(x=>x.id===e.target.dataset.id);if(p){p.status=e.target.value;saveItem('priority',p);toast('Status pengajuan diperbarui.')}return}if(e.target.id==='importFile'&&e.target.files?.[0])importJSONFile(e.target.files[0]);});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){query=e.target.value;if(currentView==='tasks'){const taskSearch=document.getElementById('taskSearch');if(taskSearch)taskSearch.value=query;render()}else if(query.length>1){setView('tasks');const t=document.getElementById('taskSearch');if(t)t.value=query;render()}}});
document.querySelectorAll('.nav button[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
// Load a previously configured cloud project automatically. Local mode works without a configuration.
const cfg=loadConfig();if(cfg.url&&cfg.key&&window.supabase?.createClient){configureClient(cfg.url,cfg.key).catch(e=>setStatus('Mode lokal aktif','Koneksi otomatis belum berhasil. '+e.message,'error'))}else setStatus('Mode lokal aktif','Data disimpan di browser ini. Hubungkan database untuk sinkron antar perangkat.','local');
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
render();
})();
</script>
</body>
</html>
